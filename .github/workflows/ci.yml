name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keka_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
        - name: Cache node modules
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keka_test_db
        run: npm test

      - name: Run migrations and DB integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keka_test_db
        run: |
          npm run migrate:pg
        - name: Run migrations, start server and run DB + E2E tests
          env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keka_test_db
            PORT: 3000
          run: |
            npm run migrate:pg
            # start server in background
            node server.js &
            SERVER_PID=$!
            echo "Waiting for server to become healthy..."
            for i in {1..30}; do
              if curl -sSf http://localhost:3000/health >/dev/null; then
                echo "Server is healthy"; break
              fi
              sleep 1
            done
            npm test -- --grep "DB integration|HTTP end-to-end"
            kill $SERVER_PID || true
